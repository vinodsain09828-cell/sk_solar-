<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="skSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--accent-glow, #6ee7b7)" />
      <stop offset="50%" stop-color="var(--accent, #10b981)" />
      <stop offset="100%" stop-color="var(--primary, #064e3b)" />
    </linearGradient>
    <linearGradient id="skSolarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--accent, #10b981)" />
      <stop offset="100%" stop-color="var(--primary, #064e3b)" />
    </linearGradient>
    <filter id="skGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="var(--accent, #10b981)" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(6, 8)" filter="url(#skGlow)">
    <!-- Base Shield / Rounded Hexagon -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="var(--primary, #064e3b)" />
    
    <!-- Stylized Solar Panel Grid -->
    <path d="M16 46 L26 22 L38 22 L48 46 Z" fill="none" stroke="var(--accent-glow, #6ee7b7)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Panel Grid Dividers -->
    <path d="M21 34 L43 34" stroke="var(--accent-glow, #6ee7b7)" stroke-width="2"/>
    <path d="M32 22 L32 46" stroke="var(--accent-glow, #6ee7b7)" stroke-width="2"/>
    <path d="M25 46 L28 34" stroke="var(--accent-glow, #6ee7b7)" stroke-width="1.5"/>
    <path d="M39 46 L36 34" stroke="var(--accent-glow, #6ee7b7)" stroke-width="1.5"/>

    <!-- Radiant Rising Sun -->
    <circle cx="32" cy="18" r="6" fill="#FBBF24" />
    <path d="M32 8 L32 11" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 12 L24.5 14" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    <path d="M42 12 L39.5 14" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <!-- Main Brand Title -->
  <text x="82" y="44" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="32" letter-spacing="-0.03em" fill="var(--brand-title-color, var(--primary, #064e3b))">
    SK <tspan fill="var(--accent, #10b981)">SOLAR</tspan>
  </text>

  <!-- Subtitle / Location & Tagline -->
  <text x="83" y="60" font-family="'DM Sans', 'Inter', system-ui, sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.18em" fill="var(--text-muted, #526b62)">
    POWER SYSTEMS • BIKANER
  </text>
</svg>